# CI: everything that can be proven without the live network or the org's key.
#
# The live suites (Kermit) and the Vault integration are NOT run here — they need a funded testnet
# identity and a Vault. They are the release gate, run by hand: see docs/OPERATIONS.md ("Release checks").
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # `npm ci` runs the postinstall that patches accumulate.js's Time.encode — if that hook ever breaks,
      # this step fails, which is the point (docs/DEPLOY.md explains why the patch exists).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  vault:
    # The PRODUCTION key posture. Proves Vault's signature over the real wallet preimage verifies —
    # this is a service container, no secrets required, so it belongs in CI.
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: create the transit keys the suite signs with (ed25519 and ecdsa-p256)
        run: |
          curl -sf -H "X-Vault-Token: root" -X POST http://127.0.0.1:8200/v1/sys/mounts/transit -d '{"type":"transit"}'
          curl -sf -H "X-Vault-Token: root" -X POST http://127.0.0.1:8200/v1/transit/keys/wallet-test -d '{"type":"ed25519"}'
          curl -sf -H "X-Vault-Token: root" -X POST http://127.0.0.1:8200/v1/transit/keys/wallet-test-p256 -d '{"type":"ecdsa-p256"}'
      - run: npx vitest run test/vault-transit.test.ts
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: root
          VAULT_KEY: wallet-test

  pkcs11:
    # Phase 8.1 key source against a real PKCS#11 token: SoftHSM2 in the container test/docker/softhsm builds,
    # with the pkcs11js addon compiled explicitly (scripts/build-pkcs11js.sh), never by an install script.
    # The token, its throwaway PINs and its keys are created inside the container and die with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/pkcs11-it.mjs

  kms:
    # Phase 8.2 AWS KMS adapter against LocalStack (kms only). The suite creates its own keys inside
    # LocalStack; the credentials are LocalStack's documented placeholders, not secrets.
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.4.0
        env:
          SERVICES: kms
        ports: ["15466:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/fix-accumulate-encoding.mjs
      - name: wait for LocalStack KMS
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:15466/_localstack/health | grep -Eq '"kms": *"(available|running)"'; then exit 0; fi
            sleep 2
          done
          echo "LocalStack KMS never became available" >&2
          exit 1
      - run: npx vitest run test/cloud-kms-aws.test.ts
        env:
          KMS_ENDPOINT: http://127.0.0.1:15466
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

  image:
    # The deployable artifact must actually build. This is what caught the postinstall/Dockerfile break.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: certen/external-policy-signer:ci
