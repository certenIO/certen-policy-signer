apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wallet.fullname" . }}-secrets
  labels: {{- include "wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- if .Values.signerSeedHex }}
---
# The signing key lives in its OWN Secret, deliberately: the Secret above is consumed with `envFrom`, so
# anything in it becomes an environment variable in the pod spec. The key must never be one — it is mounted
# as a file (mode 0400) and nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wallet.fullname" . }}-signer-key
  labels: {{- include "wallet.labels" . | nindent 4 }}
type: Opaque
stringData:
  signer-seed: {{ .Values.signerSeedHex | quote }}
{{- end }}
