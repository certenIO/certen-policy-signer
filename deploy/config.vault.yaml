# Production key posture (docker-compose.vault.yml): the signing key lives in Vault and never leaves it.
# The org's key page must carry the VAULT key's public key hash — SR6 verifies that at boot, fail-closed.
wallet:
  org_id: "demo-org"
  network: "kermit"
  accumulate_endpoints: ["https://kermit.accumulatenetwork.io/v3"]
  signer_url: "acc://demo-org.acme/book/1"
  attachment_model: "per_tx"

signer:
  provider: "vault-transit"
  vault:
    addr: "http://vault:8200"        # a real Vault cluster in production (see docs/OPERATIONS.md)
    key_name: "org-accum"            # ed25519 transit key
    token: "env:VAULT_TOKEN"         # use AppRole / k8s auth in production, not a root token

policy:
  url: "http://policy:9099/decision"
  mode: "sync"
  auth: "none"
  timeout_ms: 10000

trigger:
  webhook: { enabled: false, bind: "0.0.0.0:8080" }
  poller: { enabled: true, interval_seconds: 20 }

behavior:
  submit_reject_vote: true

store:
  path: "/data/wallet-state.json"

health: { bind: "0.0.0.0:8080" }
admin:
  api_key: "env:ADMIN_API_KEY"

observability: { log_level: "info", metrics: true }
