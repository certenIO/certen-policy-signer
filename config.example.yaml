# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  certen-external-policy-signer — annotated reference config
#
#  Copy this, delete what you do not need, and read the comments on the ones you keep. Every option that
#  can change WHAT GETS SIGNED is marked. Secrets are never written here: use `env:NAME` to read them from
#  the environment, or a file path for a mounted Docker/Kubernetes secret.
#
#  Minimum viable config is much smaller than this file — see the "Quick start" section of the README.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════

wallet:
  # A label for logs and receipts. Any string; use something you will recognize in an incident.
  org_id: "example-org"

  # Free-form network label, for logs only — nothing branches on it. Omit and the endpoint host is
  # logged instead. Works with any Accumulate network: public, devnet, or private.
  network: "kermit"

  # The Accumulate v3 JSON-RPC endpoint(s). The first is used.
  accumulate_endpoints:
    - "https://kermit.accumulatenetwork.io/v3"

  # ── Which key page this signer acts for ──────────────────────────────────────────────────────────
  # Single-scope: one page, plus the top-level `signer:` block below. This is the common case.
  signer_url: "acc://example-org.acme/book/1"

  # Multi-scope alternative: watch several pages, each with its own key and custody. Mutually exclusive
  # with signer_url. One poller per scope, one shared decision pipeline; the keyring picks the key by
  # page. See config.multi-scope.example.yaml.
  #
  # A scope may also override `policy` and `behavior` — the top-level blocks below are the DEFAULTS, and a
  # scope states only what differs. This is how a fleet of agents with divergent rules runs in one process:
  # each overriding scope gets its own policy client, credential, and ceiling, so one agent's engine going
  # down (or its secret leaking) does not reach the others. An unknown key inside a scope's policy/behavior
  # STOPS THE BOOT rather than being ignored — a typo would silently mean "inherit".
  # scopes:
  #   - page: "acc://team-a.acme/book/1"
  #     key: { provider: "local", local: { seed_file: "/run/secrets/team_a_seed" } }
  #   - page: "acc://team-b.acme/book/1"
  #     key: { provider: "vault-transit", vault: { addr: "https://vault:8200", key_name: "team-b", token: "env:VAULT_TOKEN" } }
  #     policy: { url: "https://rules.internal/team-b/decide", hmac_secret: "env:TEAM_B_HMAC" }
  #     behavior: { value_ceiling: "100000", submit_reject_vote: true }
  #
  # A ROLE PAGE WITH ONE SEAT PER APPROVER. A key page holds several keys with a threshold, so a page
  # can carry a seat per person -- and then the PROTOCOL counts the approvals, not an application. `key`
  # stays the key this wallet signs with when nobody is named; `keys` are the named ones, and a ref this
  # wallet holds no key for is refused rather than falling back to `key`.
  #
  # The refs are opaque to this file -- nothing here can check one against an identity, and what binds
  # a ref to a person is the key page entry it resolves to, which is on chain and was put there
  # deliberately. But they are NOT arbitrary:
  #
  #   ** A REF MUST BE THE APPROVER'S CONSOLE SIGN-IN, EXACTLY. **
  #
  # The approval console names the approver on its decision (`evidence.approverKeyRef`, Runbook F T29)
  # using the account they signed in with, and this wallet looks that string up here. A ref of "alice"
  # against a console that sends "alice@bank.example" matches nothing -- and a ref this wallet holds no
  # key for is REFUSED, never quietly signed with `key` above, so the vote does not happen at all. That
  # refusal is deliberate: substituting the organisation's key would put one person's approval on chain
  # under a key they never touched, which is the whole thing T29 exists to prevent.
  #
  #   - page: "acc://bank.acme/roles/treasury/1"      # accept threshold 2, set on chain
  #     key:  { provider: "vault-transit", vault: { addr: "https://vault:8200", key_name: "treasury-org", token: "env:VAULT_TOKEN" } }
  #     keys:
  #       alice@bank.example: { provider: "vault-transit", vault: { addr: "https://vault:8200", key_name: "alice-seat", token: "env:VAULT_TOKEN", key_type: "ecdsa-p256" } }
  #       bob@bank.example:   { provider: "vault-transit", vault: { addr: "https://vault:8200", key_name: "bob-seat",   token: "env:VAULT_TOKEN", key_type: "ecdsa-p256" } }
  #
  # THE SAME THING WITH THE BANK'S OWN PKI, which is the point of Runbook F: no key is generated for
  # anybody and NO KEY MATERIAL APPEARS IN THIS FILE. Each approver's certificate stays in the Windows
  # certificate store -- issued by the corporate CA, or on the PIV/CAC card they already carry -- and is
  # named here only by thumbprint. Build the agent once:
  #   dotnet build agent/windows-cert-store/certen-cert-agent.csproj -c Release
  #
  #   - page: "acc://bank.acme/roles/treasury/1"
  #     key:  { provider: "vault-transit", vault: { addr: "https://vault:8200", key_name: "treasury-org", token: "env:VAULT_TOKEN" } }
  #     keys:
  #       alice@bank.example:
  #         provider: "windows-cert-store"
  #         windows: { thumbprint: "9BAE0FE822B270A258395C26436CEFC8BB42E37B", agent_path: "agent/windows-cert-store/bin/Release/net9.0/certen-cert-agent.exe" }
  #       bob@bank.example:
  #         provider: "windows-cert-store"
  #         windows: { thumbprint: "266777A1E4BA2F5F49C92F26C8E73B7D60903650", agent_path: "agent/windows-cert-store/bin/Release/net9.0/certen-cert-agent.exe" }
  #
  # The signature type is read off each certificate rather than configured, so the same block works
  # whether an approver's credential is RSA (what a corporate CA usually issues) or ECDSA P-256 (what a
  # YubiKey you provision yourself usually holds). A card that demands a PIN per signature gets to: the
  # agent is invoked once per signature and is not kept alive between them.
  #
  # THE ORGANISATION HOLDING A KEY INSIDE SOMEBODY'S IDENTITY. Runbook F 0.4 accepts this: a page in an
  # employee's own book, carrying the organisation's key, so an expired certificate can be rotated and
  # a leaver retired without orphaning the identity. The price is that the same key can approve a
  # payment in her name, so the deployment declares whose behalf it is held on and every signature made
  # there says so -- which is what turns the exception into something the system reports rather than
  # something the documentation discloses.
  #
  #   - page: "acc://bank.acme/alice/book/1"        # the ORG's key, inside Alice's identity
  #     key: { provider: "vault-transit", vault: { addr: "https://vault:8200", key_name: "employee-governance", token: "env:VAULT_TOKEN" } }
  #     acts_for: "Alice Okonkwo"
  #
  # DECLARED, because it cannot be inferred. A key page entry is sha256(publicKey) for every key type
  # alike, so nothing on a page distinguishes a person's certificate from a software key, and the
  # algorithm is a heuristic -- the organisation's own key may be ECDSA, which this file already
  # supports. Omit it wherever the organisation signs as itself; that is the ordinary case and stays
  # silent, because an alarm that fires on every transaction is worth nothing within a week.

  # WHAT A PER-PERSON KEY IN THE ORGANISATION'S VAULT DOES AND DOES NOT ESTABLISH. It makes attribution
  # real on chain -- two seats, two signatures, two distinct keys in the record. It does NOT establish
  # that the person agreed: this process can ask Vault for either signature at any time, without them.
  # That is a pilot posture, and the production choice between it, a smartcard, and a remote signing
  # service is Runbook F's §F6. See the header of src/signer/vault-transit.ts.

  # How this signer is attached to the transactions it signs.
  #   authority — the key book is named as an authority (the usual case)
  #   delegate  — signing on behalf of a delegator (set delegator_url)
  #   per_tx    — named per transaction, in the transaction header
  attachment_model: "authority"
  delegator_url: null

  # SR6 startup self-check: refuse to boot unless this signer's public key is verifiably on the page
  # above. Leave false. Setting it true downgrades a failure to a warning, and the failure it hides is
  # "every vote you cast will be silently rejected by the network". Only for pages whose key hashes the
  # node will not expose.
  allow_unverified_signer: false

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  KEY CUSTODY — where the private key lives. Used in single-scope mode.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
signer:
  # vault-transit — PRODUCTION. The key is generated inside HashiCorp Vault and never leaves it; Vault
  #                 performs the Ed25519 signature. This process never holds private key material.
  # local         — the key is held in this process's memory. Simpler; a deliberate, documented tradeoff
  #                 for pilots. See "Key posture" in docs/DEPLOY.md.
  # local-ecdsa-p256 — the same in-process posture, with an ECDSA P-256 key rather than Ed25519: the key
  #                 type a corporate PKI certificate actually is. Accumulate verifies it natively, and the
  #                 key page entry is sha256 of the PKIX DER public key, exactly as for any other type.
  provider: "vault-transit"
  vault:
    addr: "https://vault.internal:8200"
    key_name: "example-org-accumulate"
    token: "env:VAULT_TOKEN"
    # What Vault holds under that name: "ed25519" (the default) or "ecdsa-p256". Vault Transit signs
    # both natively. The default is CHECKED against Vault's own answer on the first read rather than
    # trusted -- a wallet that signed with one algorithm while naming the other in its metadata would
    # be refused by the network with an error about the signature rather than about this line.
    # key_type: "ecdsa-p256"

  # local:
  #   seed_hex: "env:SIGNER_SEED_HEX"        # 32-byte hex seed, or...
  #   seed_file: "/run/secrets/signer_seed"  # ...a file holding it (Docker/Kubernetes secret mount)
  #   allow_ephemeral: false                 # dev only: generate a throwaway key. It matches no on-chain
  #                                          # page, so every vote it casts is rejected. Never in prod.

  # For provider: "local-ecdsa-p256" — hex-encoded DER (SEC1 or PKCS#8), not PEM: a PEM inside a YAML
  # string is a newline-mangling accident waiting to happen, and the failure would look like a bad key.
  # local:
  #   private_key_der_hex: "env:SIGNER_P256_DER_HEX"
  #   private_key_der_file: "/run/secrets/signer_p256.der.hex"

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  YOUR POLICY ENGINE — the decision this signer obeys.
#  Contract and a runnable reference implementation: examples/policy-engine.mjs
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
policy:
  url: "https://policy.internal.example-org/decision"

  # Already have an approvals API? Point the signer at it directly instead of deploying a translating
  # shim. A module default-exporting { name, buildRequest?, parseResponse? } reshapes the request, the
  # response, or both — see examples/policy-adapter.mjs.
  #
  # The fail-closed rule is enforced AROUND it, not delegated to it: only approve/deny/pending count as
  # decisions, the response MAC is verified before your parser sees the body, and an adapter that throws
  # withholds the signature. It describes where to find a decision; it cannot widen what one is.
  # adapter_module: "./adapters/our-approvals-api.mjs"

  # Only "sync" is implemented: the signer POSTs and waits. An engine that cannot answer immediately
  # replies {"decision":"pending"} and the signer asks again next poll — see examples/policy-engine.mjs.
  mode: "sync"

  # none | hmac. With hmac, the signer signs its request and REQUIRES a valid signature on the response,
  # so a decision cannot be forged or replayed by anything on the network path.
  #
  # "hmac" with an empty secret is REFUSED at startup rather than quietly falling back to unauthenticated
  # — so if POLICY_HMAC_SECRET below is not set in the environment, the signer will not boot. "mtls" is
  # also refused: it is not implemented, so it would mean plaintext under a name promising otherwise.
  # Terminate mTLS in a proxy in front of your engine and set "none".
  auth: "hmac"
  hmac_secret: "env:POLICY_HMAC_SECRET"

  # Header names for the signed channel. Defaults shown; point them at whatever your engine already
  # emits. The legacy `x-certen-signature` is always accepted on responses for backward compatibility.
  signature_header: "x-signer-signature"
  timestamp_header: "x-signer-timestamp"

  # How long to wait for a decision. A timeout is fail-closed: nothing is signed and it retries.
  timeout_ms: 10000

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  INTENT DECODING — how a transaction becomes the sentence and amounts your engine decides on.
#  This is the seam you extend for your own payload format. Guide: docs/INTEGRATION.md §1
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
resolver:
  # Load your own decoders — a path or a package name. No fork required. See examples/custom-decoder.mjs.
  # decoder_modules:
  #   - "./examples/custom-decoder.mjs"

  # Explicit chain order, FIRST CLAIM WINS — a specific decoder must precede a general one. Omit to use
  # the built-in order (loaded modules first, then send-tokens, certen-intent, write-data). The terminal
  # `fallback` is always appended. An unknown name here stops the boot rather than running one short.
  # decoders: ["acme-purchase-order", "send-tokens", "write-data"]

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  TRIGGERS — how pending transactions are discovered.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
trigger:
  poller:
    enabled: true
    interval_seconds: 20
  webhook:
    # Push instead of poll. Requires hmac_secret: without one the route returns 403 rather than
    # existing unauthenticated.
    enabled: false
    hmac_secret: "env:WEBHOOK_HMAC_SECRET"
    signature_header: "x-signer-signature"
    bind: "0.0.0.0:8080"

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  OUTBOUND NOTIFICATIONS — text message, email, Slack, or your own webhook. Omit the block to disable.
#
#  Configure any combination. Every channel is a single HTTPS POST, so none of this adds a dependency.
#
#  DELIVERY IS BEST-EFFORT — the one place this signer does NOT fail closed. A notification that cannot be
#  delivered is logged and dropped; it never delays, blocks, or changes a signing decision. A signer that
#  stopped signing because Twilio was down would be a worse signer. The durable record is the receipt
#  store, not this.
#
#  THE EVENTS
#    pending.discovered   a tx naming your book needs a decision. Fired ONCE per tx, on first sighting.
#    decision.approved    signed an accept vote
#    decision.denied      denied
#    signature.failed     you decided to vote and the vote could not be submitted — the one to page on
#    signer.paused        someone hit the emergency stop (and signer.resumed)
#
#  There is no "still waiting" event: it would fire every poll for the life of the transaction. For a live
#  work queue use GET /v1/requests?status=awaiting_policy.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# notify:
#   # Which events to send. Omitted: webhook and slack get everything, while sms and email get only
#   # pending.discovered + signature.failed — they cost money per message and interrupt a person.
#   # events: ["pending.discovered", "signature.failed"]
#
#   # Text message. Twilio, or any Twilio-compatible gateway.
#   sms:
#     to: ["+15551234567"]                 # one or more; a failure to one does not mute the others
#     from: "+15559876543"                 # your Twilio number
#     account_sid: "env:TWILIO_ACCOUNT_SID"
#     auth_token: "env:TWILIO_AUTH_TOKEN"
#
#   email:                                  # SendGrid
#     to: ["ops@example-org.com"]
#     from: "signer@example-org.com"
#     api_key: "env:SENDGRID_API_KEY"
#
#   slack:
#     webhook_url: "env:SLACK_WEBHOOK_URL"  # the URL IS the credential — keep it in the environment
#
#   # Anything the above does not cover: your pager, a ticket queue, a channel none of these speak.
#   # Receiver with the payload documented: examples/notifier.mjs
#   webhook:
#     url: "https://hooks.internal.example-org/certen-signer"
#     hmac_secret: "env:NOTIFY_HMAC_SECRET" # same MAC scheme as the policy channel; unsigned if omitted
#     timeout_ms: 5000
#     signature_header: "x-signer-signature"

behavior:
  # On a deny: true casts an explicit REJECT vote, killing the transaction now. false withholds the
  # signature and lets it expire. Both are safe; the first is auditable and immediate, the second is
  # quieter. Note a reject vote is still a SIGNATURE, so an emergency pause suppresses it too.
  submit_reject_vote: false

  # Retries when the key page version moves under us mid-signature — a benign race, not a failure.
  max_bad_version_retries: 3

  # SR4 local ceiling, defense-in-depth BEHIND your policy engine: refuse to sign if ANY amount exceeds
  # this, compared as a big integer. Optional. This is a backstop for an engine bug, not a policy.
  # value_ceiling: "1000000"

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  DURABLE STATE — idempotency (never vote twice) and the receipt audit trail.
#  Omit the path and BOTH die with the process: a restart can double-vote and the audit trail is lost.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
store:
  path: "/data/signer-state.json"

health:
  bind: "0.0.0.0:8080"

# Admin routes (including the emergency pause) share the health listener. There is no separate admin
# port, so api_key — not a bind address — is what protects them. Without it, every admin route returns
# 403 and the pause is unavailable.
admin:
  api_key: "env:ADMIN_API_KEY"
  # Separate, higher-privilege credential for key-page governance. Changing a key changes who can act
  # for your organization, so it is deliberately not the same credential as the pause.
  # governance_admin_key: "env:GOVERNANCE_ADMIN_KEY"

observability:
  log_level: "info"
  metrics: true
  # /metrics shares the public health listener, so it is admin-authenticated by default. Set true only
  # if that port is already private (e.g. a ClusterIP scraped by an in-cluster Prometheus).
  metrics_public: false

# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#  OPTIONAL VENDOR ADAPTER — vote through the Certen api-gateway's external-signing seam instead of
#  submitting to Accumulate directly. Off by default; most deployments never touch this. Your key still
#  never leaves this process — the gateway hands over bytes and you decide whether to sign them.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
# gateway:
#   enabled: true
#   url: "https://gateway.internal:8090"
#   api_key: "env:GATEWAY_API_KEY"
#   identity: "acc://example-org.acme"
#   timeout_ms: 20000
